<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Departments | PeopleDesk</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/directory-filters.css}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="main-content"><header class="page-header"><div><p class="eyebrow">DIRECTORY / ORGANIZATION</p><h1>Departments</h1><p class="muted">Organize teams and their employee associations.</p></div><a class="button button-primary" th:href="@{/departments/new}">＋ Add department</a></header><div class="flash-message" th:if="${message}" th:text="${message}"></div><section class="content-section"><form class="toolbar" method="get" th:action="@{/departments}"><label class="search-field"><span>⌕</span><input name="q" th:value="${q}" placeholder="Search department or description"></label><button class="button button-secondary" type="submit">Search</button><a class="button button-quiet" th:href="@{/departments}">Clear</a></form><div class="table-wrap"><table><thead><tr><th>Department</th><th>Description</th><th>Employees</th><th></th></tr></thead><tbody><tr th:each="department : ${departments}"><td><strong th:text="${department.name}"></strong><small th:text="${'DEPT-' + department.id}"></small></td><td th:text="${department.description}"></td><td th:text="${employeeCounts.get(department.id) ?: 0}"></td><td class="actions"><a class="icon-link" th:href="@{/departments/{id}/edit(id=${department.id})}">Edit</a><form th:action="@{/departments/{id}/delete(id=${department.id})}" method="post" data-confirm="Delete this department?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="icon-button danger-text" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(departments)}"><td colspan="4" class="empty-state">No departments match that search.</td></tr></tbody></table></div></section></main></body></html>
