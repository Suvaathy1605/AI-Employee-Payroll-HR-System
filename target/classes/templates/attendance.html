<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Attendance | PeopleDesk</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="main-content"><header class="page-header"><div><p class="eyebrow">PEOPLE OPERATIONS / TIME</p><h1>Attendance</h1><p class="muted">Record a monthly summary. Absences and attendance percentage are calculated automatically.</p></div></header><div class="flash-message" th:if="${message}" th:text="${message}"></div>
<section class="form-panel"><div class="section-heading"><div><p class="eyebrow">MONTHLY RECORD</p><h2>Record attendance</h2></div></div><form th:action="@{/attendance/save}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><label>Employee<select name="employeeId" required><option value="">Select employee</option><option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.employeeCode + ' · ' + employee.name}"></option></select></label><label>Month<input type="month" name="period" required></label><label>Working days<input type="number" name="workingDays" min="1" max="31" required></label><label>Present days<input type="number" name="presentDays" min="0" required></label><label>Leave days<input type="number" name="leaveDays" min="0" value="0" required></label></div><div class="form-actions"><button class="button button-primary" type="submit">Save attendance</button></div></form></section>
<section class="content-section"><div class="section-heading"><div><p class="eyebrow">HISTORY</p><h2>Monthly records</h2></div></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Period</th><th>Working</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance</th></tr></thead><tbody><tr th:each="record : ${attendanceRecords}"><td><strong th:text="${record.employee.name}"></strong><small th:text="${record.employee.employeeCode}"></small></td><td th:text="${record.period}"></td><td th:text="${record.workingDays}"></td><td th:text="${record.presentDays}"></td><td th:text="${record.absentDays}"></td><td th:text="${record.leaveDays}"></td><td><strong th:text="${#numbers.formatDecimal(record.attendancePercentage,1,1) + '%'}"></strong></td></tr><tr th:if="${#lists.isEmpty(attendanceRecords)}"><td colspan="7" class="empty-state">No attendance records yet.</td></tr></tbody></table></div></section></main></body></html>
