<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Department form | PeopleDesk</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="main-content"><header class="page-header"><div><p class="eyebrow">ORGANIZATION / DEPARTMENT</p><h1 th:text="${department.id == null ? 'Add department' : 'Edit department'}"></h1><p class="muted">Departments with employees cannot be deleted.</p></div><a class="button button-quiet" th:href="@{/departments}">← Back</a></header><form class="form-panel compact-form" th:action="@{/departments/save}" th:object="${department}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}"><label>Department name<input th:field="*{name}" maxlength="80" required><small class="field-error" th:errors="*{name}"></small></label><label>Description<textarea th:field="*{description}" rows="4" maxlength="500"></textarea></label><div class="form-actions"><a class="button button-quiet" th:href="@{/departments}">Cancel</a><button class="button button-primary" type="submit">Save department</button></div></form></main></body></html>
