<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employees | PeopleDesk</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/directory-filters.css}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="main-content"><header class="page-header"><div><p class="eyebrow">DIRECTORY / PEOPLE</p><h1>Employees</h1><p class="muted">Search and maintain employee records.</p></div><a class="button button-primary" th:href="@{/employees/new}">＋ Add employee</a></header>
<div class="flash-message" th:if="${message}" th:text="${message}"></div><section class="content-section"><form class="toolbar" method="get" th:action="@{/employees}"><label class="search-field"><span>⌕</span><input name="q" th:value="${q}" placeholder="Search name, ID, or email"></label><label class="filter-field">Department<select name="departmentId"><option value="">All departments</option><option th:each="department : ${departments}" th:value="${department.id}" th:selected="${department.id == departmentId}" th:text="${department.name}"></option></select></label><label class="filter-field">Sort by<select name="sort"><option value="name" th:selected="${sort == 'name'}">Name</option><option value="employeeCode" th:selected="${sort == 'employeeCode'}">Employee ID</option><option value="salary" th:selected="${sort == 'salary'}">Salary</option><option value="joiningDate" th:selected="${sort == 'joiningDate'}">Joining date</option></select></label><label class="filter-field">Order<select name="direction"><option value="asc" th:selected="${direction == 'asc'}">Ascending</option><option value="desc" th:selected="${direction == 'desc'}">Descending</option></select></label><button class="button button-secondary" type="submit">Apply</button><a class="button button-quiet" th:href="@{/employees}">Clear</a></form>
<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Role</th><th>Contact</th><th>Basic salary</th><th></th></tr></thead><tbody><tr th:each="employee : ${employees}"><td><strong th:text="${employee.name}"></strong><small th:text="${employee.employeeCode}"></small></td><td th:text="${employee.department != null ? employee.department.name : 'Unassigned'}"></td><td><span th:text="${employee.designation}"></span><small th:text="${employee.joiningDate}"></small></td><td><span th:text="${employee.email}"></span><small th:text="${employee.phone}"></small></td><td th:text="${#numbers.formatDecimal(employee.basicSalary,1,'COMMA',2,'POINT')}"></td><td class="actions"><a class="icon-link" th:href="@{/employees/{id}/edit(id=${employee.id})}" aria-label="Edit employee">Edit</a><form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post" data-confirm="Delete this employee record?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="icon-button danger-text" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="6" class="empty-state">No matching employees found.</td></tr></tbody></table></div></section></main></body></html>
